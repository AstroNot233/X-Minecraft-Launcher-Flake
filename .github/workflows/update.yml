name: update

on:
  # Upstream releases at their own pace; a weekly check is enough.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# A scheduled run and a manual one must not push over each other.
concurrency:
  group: update
  cancel-in-progress: false

# config.json drives the channels and the systems; the scripts in
# .github/scripts/ do the work, so a later switch from pinning upstream
# artifacts to caching a local build only replaces the hash job.
jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: load
        name: Load config.json
        run: bash .github/scripts/config.sh

  resolve:
    needs: config
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: resolve
        name: Resolve the upstream channels
        env:
          # The anonymous rate limit is per IP, and a runner shares its IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve.sh

  hash:
    needs: [config, resolve]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Per system: parallel jobs, but never the same store paths at once.
    concurrency:
      group: update-hash-${{ matrix.name }}
      cancel-in-progress: false
    env:
      SYSTEM: ${{ matrix.name }}
      VERSIONS: ${{ needs.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Pinning the version makes the build fetch that release's artifact, and
      # the mismatch report is where the wanted hash comes from. A runner can
      # only do this for its own system: asking for the other one reports
      # "platform mismatch" instead of a hash.
      - name: Read the hashes this system needs
        run: bash .github/scripts/hash.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hash-${{ matrix.name }}
          path: hash.env

  publish:
    needs: [config, resolve, hash]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSIONS: ${{ needs.resolve.outputs.versions }}
      HASHES_DIR: ${{ github.workspace }}/hashes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: hashes

      - id: apply
        name: Apply the versions and hashes
        run: bash .github/scripts/apply.sh

      # Builds each pinned source, i.e. fails when a hash written above does not
      # match the artifact it names.
      - name: Verify the pinned hashes
        if: steps.apply.outputs.changed == 'true'
        run: bash .github/scripts/verify.sh

      - name: Refresh the readme dashboard
        if: steps.apply.outputs.changed == 'true'
        run: bash .github/scripts/report.sh

      - name: Commit, tag and push
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          bash .github/scripts/commit.sh
